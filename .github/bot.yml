name: 24/7 ZAGRA GAMES BOT

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/5 * * * *' # Bot fonda doimiy tekshirib turiladi

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Libraries
      run: |
        pip install pyTelegramBotAPI telebot

    - name: Run Cyber Bot Engine
      run: |
        python zagra.py

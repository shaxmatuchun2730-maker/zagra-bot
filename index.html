<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zagra Timer | Premium Cyber Edition</title>
    <!-- Telegram WebApp Rasmiy Moduli -->
    <script src="https://telegram.org"></script>
    
    <!-- Google Firebase Rasmiy SDK Kutubxonalari (CORS va Bloklarni yo'qotish uchun) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <!-- CSS Bezak Faylimizni Ulaymiz -->
    <link rel="stylesheet" href="style.css">
    <!-- JavaScript Motorini DEFER (Xavfsiz kutish) bilan ulaymiz -->
    <script src="script.js" defer></script>
</head>
<body>

    <div class="game-wrapper">
        <!-- Yuqori Xalqaro Statisika -->
        <header class="header-stats">
            <div class="stat-box">
                <span class="stat-label">💎 TOTAL SCORES</span>
                <div id="score-val" class="stat-value">0</div>
            </div>
            <div class="stat-box">
                <span class="stat-label">🎯 1.000 KINGS</span>
                <div id="perfect-val" class="stat-value">0</div>
            </div>
        </header>

        <!-- Markaziy Premium Shishali Doska -->
        <main class="timer-container">
            <div id="game-view" class="game-board-layout">
                <div class="glass-board">
                    <div id="timer">0.000</div>
                    <div id="feedback">READY TO HIT</div>
                </div>
                <button id="action-btn" class="stop-btn">START</button>
            </div>

            <!-- Dynamic Leaderboard (Reyting Oynasi) -->
            <section id="rank-view" class="view-panel">
                <div class="sub-tabs">
                    <button id="sub-perfects" class="sub-btn active">🎯 1.000 Kings</button>
                    <button id="sub-scores" class="sub-btn">💎 Total Scores</button>
                </div>
                <ul id="leaderboard" class="leaderboard-list"></ul>
                <div id="my-rank" class="my-absolute-rank">Your Rank: Loading...</div>
            </section>
        </main>

        <!-- Pastki Navigatsiya -->
        <nav class="nav-tabs">
            <button id="tab-game" class="tab-btn active">🎮 GAME</button>
            <button id="tab-rank" class="tab-btn">🏆 RANKING</button>
        </nav>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Zagra Cyber Pilot</title>
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #0a0f1d;
            --panel-color: #141b2d;
            --cyan: #00f0ff;
            --purple: #7f00ff;
            --magenta: #ff007f;
            --text-main: #ffffff;
            --text-sub: #8fa0b5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Yuqori Profil Paneli */
        .header-profile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background-color: var(--panel-color);
            border-bottom: 1px solid #1e293b;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #current-name-display {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .edit-btn {
            background: none;
            border: none;
            color: var(--cyan);
            font-size: 16px;
            cursor: pointer;
        }

        /* Markaziy Kontent Joyi */
        .content-container {
            flex: 1;
            position: relative;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .view-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            width: 100%;
            height: 100%;
        }

        /* GAME VIEW STYLES */
        #game-view {
            display: flex;
            justify-content: flex-start;
            gap: 15px;
        }

        /* Soniya tepasidagi 2 ga bo'lingan ixcham stats paneli */
        .game-stats-row {
            display: flex;
            width: 100%;
            max-width: 320px;
            background: var(--panel-color);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 10px 0;
            margin-top: 10px;
            flex-shrink: 0;
        }
        
        .game-stat-item {
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
        }
        
        .game-stat-item:first-child {
            border-right: 1px solid #1e293b;
        }
        
        .game-stat-item span {
            font-size: 11px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .game-stat-item strong {
            font-size: 18px;
            color: var(--cyan);
        }
        
        .game-stat-item strong.perf {
            color: var(--magenta);
        }

        .timer-display {
            font-size: 64px;
            font-family: monospace;
            color: var(--text-main);
            text-shadow: 0 0 15px rgba(255,255,255,0.2);
            margin: 25px 0;
            flex-shrink: 0;
        }

        #feedback {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-sub);
            height: 25px;
            margin-bottom: 25px;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        /* MUTLOQ DUMALOQ VA KO'K SOYASIZ START TUGMASI */
        .action-btn {
            width: 190px;
            height: 190px;
            min-width: 190px;
            min-height: 190px;
            flex-shrink: 0;
            border-radius: 50%;
            border: none;
            background: linear-gradient(90deg, var(--magenta), var(--purple));
            color: white;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.3);
            transition: all 0.2s ease;
            outline: none; 
            -webkit-tap-highlight-color: transparent;
        }

        /* RANK VIEW STYLES */
        .rank-header {
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-bottom: 15px;
        }

        .sub-tabs {
            display: flex;
            background: var(--panel-color);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 15px;
            border: 1px solid #1e293b;
        }

        .sub-btn {
            flex: 1;
            padding: 10px 0;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
        }

        .sub-btn.active {
            background: #1e293b;
            color: var(--cyan);
        }

        #my-rank {
            font-size: 13px;
            color: var(--cyan);
            margin-bottom: 10px;
            display: block;
        }

        .leaderboard-list {
            width: 100%;
            max-width: 400px;
            list-style: none;
            background: var(--panel-color);
            border-radius: 12px;
            border: 1px solid #1e293b;
            max-height: 55vh;
            overflow-y: auto;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid #1e293b;
            font-size: 14px;
        }

        .leaderboard-item:last-child { border-bottom: none; }
        .leaderboard-item .rank { color: var(--text-sub); font-weight: bold; width: 35px; }

        /* Pastki Asosiy Navigatsiya Tablari */
        .nav-tabs {
            display: flex;
            background-color: var(--panel-color);
            border-top: 2px solid #1e293b;
            z-index: 10;
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 15px 0;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .tab-btn.active {
            color: var(--cyan);
            border-top: 3px solid var(--cyan);
            background: linear-gradient(to bottom, rgba(0, 240, 255, 0.05), transparent);
        }

        /* MODAL OYNA (EDIT PROFILE) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 15, 0.85);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            background: var(--panel-color);
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 320px;
            position: relative;
            text-align: center;
        }

        .modal-close {
            position: absolute;
            top: 15px; right: 15px;
            background: none; border: none;
            color: var(--text-sub); font-size: 20px;
            cursor: pointer;
        }

        .modal-box h3 { margin-bottom: 15px; font-size: 18px; color: #fff; }
        
        .modal-box input {
            width: 100%;
            padding: 12px;
            background: #0a0f1d;
            border: 1px solid #1e293b;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, var(--cyan), #0072ff);
            color: white; border: none; border-radius: 8px;
            font-weight: bold; font-size: 15px; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Yuqori Profil Paneli -->
    <div class="header-profile">
        <div class="user-info">
            <span id="current-name-display">Loading...</span>
            <button class="edit-btn" id="edit-profile-trigger">✏️</button>
        </div>
    </div>

    <!-- Markaziy Kontent Hududi -->
    <div class="content-container">

        <!-- O'YIN MAYDONI (GAME VIEW) -->
        <div class="view-panel" id="game-view" style="display: flex;">
            
            <!-- Soniya (0.000) dan tepada turuvchi ixcham va chiroyli 2 talik panel -->
            <div class="game-stats-row">
                <div class="game-stat-item">
                    <span>Score</span>
                    <strong id="game-score-val">0</strong>
                </div>
                <div class="game-stat-item">
                    <span>Perfects</span>
                    <strong id="game-perfect-val" class="perf">0</strong>
                </div>
            </div>

            <div class="timer-display" id="timer">0.000</div>
            <div id="feedback">READY PILOT?</div>
            <button class="action-btn" id="action-btn">START</button>
        </div>

        <!-- REYTING HUDUDI (RANK VIEW) -->

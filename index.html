<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zagra Timer | Premium Cyber Edition</title>
    <script src="https://telegram.org"></script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <style>
        /* Ism kiritish uchun daxshatli chiroyli shishali oyna */
        .login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 6, 8, 0.95); backdrop-filter: blur(30px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; padding: 30px; transition: all 0.5s ease;
        }
        .login-box {
            width: 100%; max-width: 320px; background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 32px; padding: 40px 24px;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .login-title { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: 2px; margin-bottom: 10px; text-shadow: 0 0 10px var(--neon-cyan); }
        .login-subtitle { font-size: 12px; color: #718096; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px; }
        .login-input {
            width: 100%; padding: 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px; color: #fff; font-size: 16px; font-weight: 600; text-align: center; outline: none;
            margin-bottom: 24px; transition: all 0.3s;
        }
        .login-input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
        .login-btn {
            width: 100%; padding: 16px; border-radius: 14px; border: none;
            background: linear-gradient(90deg, #00f0ff, #0072ff); color: #fff;
            font-size: 16px; font-weight: 800; letter-spacing: 2px; cursor: pointer; box-shadow: 0 0 20px rgba(0,240,255,0.3);
        }
    </style>
</head>
<body>

    <!-- NICKNAME KIRITISH PANELI -->
    <div id="login-screen" class="login-overlay">
        <div class="login-box">
            <div class="login-title">CYBER IDENTITY</div>
            <div class="login-subtitle">Enter your pilot nickname</div>
            <input type="text" id="nickname-input" class="login-input" placeholder="💥 Enter Nickname..." maxlength="15">
            <button id="start-game-btn" class="login-btn">ENTER ARENA</button>
        </div>
    </div>

    <!-- ASOSIY O'YIN INPUTI -->
    <div class="game-wrapper">
    <!-- SHU 3 TA QATORNI QO'SHING -->
    <div style="width: 100%; display: flex; justify-content: center; margin-bottom: 10px;">
        <div id="edit-profile-trigger" style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 100px; font-size: 11px; font-weight: 700; color: #718096; letter-spacing: 1px; cursor: pointer; display: flex; align-items: center; gap: 6px;">👤 PILOT: <span id="current-name-display" style="color:#fff;">...</span> ✏️</div>
    </div>

    <header class="header-stats">
            <div class="stat-box"><span class="stat-label">💎 TOTAL SCORES</span><div id="score-val" class="stat-value">0</div></div>
            <div class="stat-box"><span class="stat-label">🎯 1.000 KINGS</span><div id="perfect-val" class="stat-value">0</div></div>
        </header>

        <main class="timer-container">
            <div id="game-view" class="game-board-layout">
                <div class="glass-board">
                    <div id="timer">0.000</div>
                    <div id="feedback">READY TO HIT</div>
                </div>
                <button id="action-btn" class="stop-btn">START</button>
            </div>

            <section id="rank-view" class="view-panel">
                <div class="sub-tabs">
                    <button id="sub-perfects" class="sub-btn active">🎯 1.000 Kings</button>
                    <button id="sub-scores" class="sub-btn">💎 Total Scores</button>
                </div>
                <ul id="leaderboard" class="leaderboard-list"></ul>
                <div id="my-rank" class="my-absolute-rank">Your Rank: Loading...</div>
            </section>
        </main>

        <nav class="nav-tabs">
            <button id="tab-game" class="tab-btn active">🎮 GAME</button>
            <button id="tab-rank" class="tab-btn">🏆 RANKING</button>
        </nav>
    </div>

</body>
</html>

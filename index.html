<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zagra Timer | Telegram Edition</title>
    <!-- Telegram WebApp Core Script -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #060709;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --neon-blue: #0072ff;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-color: #e0e6ed;
        }
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(at 10% 20%, rgba(0, 240, 255, 0.05) 0px, transparent 50%), radial-gradient(at 90% 80%, rgba(255, 0, 127, 0.05) 0px, transparent 50%);
            color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100vh; overflow: hidden; padding: 24px;
        }
        .header-stats { width: 100%; display: flex; justify-content: space-between; background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 16px 20px; border-radius: 20px; border: 1px solid var(--glass-border); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .stat-box { text-align: center; }
        .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #8a99ad; margin-bottom: 4px; }
        .stat-value { font-size: 20px; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(0, 240, 255, 0.5); }
        .timer-container { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; width: 100%; max-width: 340px; }
        .glass-board { width: 100%; background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 32px; padding: 40px 20px; text-align: center; box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.02), 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 50px rgba(0, 240, 255, 0.03); margin-bottom: 40px; }
        #timer { font-size: 64px; font-weight: 800; color: #fff; font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 25px rgba(0, 240, 255, 0.6); letter-spacing: -1px; margin-bottom: 16px; }
        #feedback { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 2.5px; color: #6d7f96; height: 20px; }
        .stop-btn { width: 100%; max-width: 280px; padding: 18px; border-radius: 16px; border: none; background: linear-gradient(90deg, #ff007f, #7f00ff); color: #fff; font-size: 18px; font-weight: 700; letter-spacing: 3px; cursor: pointer; box-shadow: 0 0 24px rgba(255, 0, 127, 0.4); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); text-shadow: 0 2px 4px rgba(0,0,0,0.2); margin-bottom: 24px; }
        .stop-btn:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <div style="width: 100%; display: flex; flex-direction: column; height: 100%;">
        <div class="header-stats">
            <div class="stat-box"><div class="stat-label">💎 SCORE</div><div id="score-val" class="stat-value">0</div></div>
            <div class="stat-box"><div class="stat-label">🎯 1.000 HITS</div><div id="perfect-val" class="stat-value">0</div></div>
        </div>
        <div class="timer-container">
            <div class="glass-board"><div id="timer">0.000</div><div id="feedback">PRESS START</div></div>
            <button id="action-btn" class="stop-btn">START</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let score = 0, perfects = 0, isRunning = false, startTime = 0, timerInterval = null;

        const timerEl = document.getElementById('timer'), feedbackEl = document.getElementById('feedback');
        const actionBtn = document.getElementById('action-btn'), scoreVal = document.getElementById('score-val'), perfectVal = document.getElementById('perfect-val');

        function updateTimer() {
            let elapsed = (performance.now() - startTime) / 1000;
            if (elapsed >= 1.5) startTime = performance.now();
            timerEl.innerText = elapsed.toFixed(3);
        }

        actionBtn.addEventListener('click', () => {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            if (!isRunning) {
                isRunning = true; actionBtn.innerText = "STOP";
                actionBtn.style.background = "linear-gradient(90deg, #00f0ff, #0072ff)";
                feedbackEl.innerText = "FOCUS NOW..."; startTime = performance.now();
                timerInterval = setInterval(updateTimer, 1);
            } else {
                isRunning = false; clearInterval(timerInterval);
                actionBtn.innerText = "START";
                actionBtn.style.background = "linear-gradient(90deg, #ff007f, #7f00ff)";
                
                let finalTime = parseFloat(timerEl.innerText);
                let addedScore = 0;

                if (finalTime === 1.000) {
                    perfects++; addedScore = 10;
                    perfectVal.innerText = perfects;
                    feedbackEl.innerText = "🎯 PERFECT HIT! +10"; feedbackEl.style.color = "var(--neon-cyan)";
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                } else if (finalTime >= 0.990 && finalTime <= 1.010) {
                    addedScore = 1;
                    feedbackEl.innerText = "🔥 SO CLOSE! +1"; feedbackEl.style.color = "#0072ff";
                } else {
                    feedbackEl.innerText = "❌ MISSED IT! TRY AGAIN"; feedbackEl.style.color = "var(--neon-pink)";
                }
                score += addedScore; scoreVal.innerText = score;

                // Ballarni daxshatli oson va bepul yo'l bilan Telegramning o'ziga yuborish
                if (addedScore > 0) {
                    tg.sendData(JSON.stringify({ score: score, perfects: perfects }));
                }
            }
        });
    </script>
</body>
</html>

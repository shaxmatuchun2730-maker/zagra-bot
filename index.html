<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zagra Timer | Glassmorphism Pro</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #060709;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --neon-blue: #0072ff;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-color: #e0e6ed;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(at 10% 20%, rgba(0, 240, 255, 0.05) 0px, transparent 50%), radial-gradient(at 90% 80%, rgba(255, 0, 127, 0.05) 0px, transparent 50%);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100vh; overflow: hidden; padding: 24px;
        }

        .header-stats {
            width: 100%; display: flex; justify-content: space-between; background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 16px 20px; border-radius: 20px; border: 1px solid var(--glass-border); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .stat-box { text-align: center; }
        .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #8a99ad; margin-bottom: 4px; }
        .stat-value { font-size: 20px; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(0, 240, 255, 0.5); }

        .timer-container { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; width: 100%; max-width: 340px; }
        .glass-board {
            width: 100%; background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 32px; padding: 40px 20px; text-align: center; box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.02), 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 50px rgba(0, 240, 255, 0.03);
            margin-bottom: 40px; position: relative;
        }
        #timer { font-size: 64px; font-weight: 800; color: #fff; font-family: 'Courier New', Courier, monospace; text-shadow: 0 0 25px rgba(0, 240, 255, 0.6); letter-spacing: -1px; margin-bottom: 16px; }
        #feedback { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 2.5px; color: #6d7f96; height: 20px; }

        .stop-btn {
            width: 100%; max-width: 280px; padding: 18px; border-radius: 16px; border: none; background: linear-gradient(90deg, #ff007f, #7f00ff);
            color: #fff; font-size: 18px; font-weight: 700; letter-spacing: 3px; cursor: pointer; outline: none; box-shadow: 0 0 24px rgba(255, 0, 127, 0.4);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); text-shadow: 0 2px 4px rgba(0,0,0,0.2); margin-bottom: 24px;
        }
        .stop-btn:active { transform: scale(0.97); box-shadow: 0 0 12px rgba(255, 0, 127, 0.2); opacity: 0.9; }

        .nav-tabs { display: flex; width: 100%; background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border-radius: 100px; padding: 6px; border: 1px solid var(--glass-border); }
        .tab-btn { flex: 1; padding: 14px; border: none; background: transparent; color: #6d7f96; font-weight: 700; font-size: 13px; letter-spacing: 1px; cursor: pointer; border-radius: 100px; transition: all 0.3s ease; }
        .tab-btn.active { background: #fff; color: var(--bg-color); box-shadow: 0 8px 16px rgba(255,255,255,0.1); }

        .view-panel { width: 100%; height: 60vh; display: none; flex-direction: column; background: rgba(6, 7, 9, 0.95); backdrop-filter: blur(20px); border-radius: 24px; border: 1px solid var(--glass-border); padding: 20px; margin-bottom: 24px; }
        .view-panel.active { display: flex; }
        .sub-tabs { display: flex; margin-bottom: 20px; gap: 10px; background: rgba(255,255,255,0.02); padding: 4px; border-radius: 12px; border: 1px solid var(--glass-border); }
        .sub-btn { flex: 1; padding: 10px; background: transparent; border: none; color: #6d7f96; font-size: 12px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .sub-btn.active { background: rgba(255, 255, 255, 0.05); color: #fff; }

        .leaderboard-list { flex-grow: 1; overflow-y: auto; list-style: none; }
        .leaderboard-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); font-size: 14px; }
        .leaderboard-item span.rank { color: var(--neon-cyan); font-weight: 700; width: 30px; }
        .my-absolute-rank { padding: 14px; text-align: center; background: rgba(0, 240, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.1); font-weight: 700; font-size: 13px; color: var(--neon-cyan); margin-top: 14px; border-radius: 12px; }
    </style>
</head>
<body>

    <div id="game-view" style="width: 100%; display: flex; flex-direction: column; height: 100%;">
        <div class="header-stats">
            <div class="stat-box"><div class="stat-label">💎 SCORES</div><div id="score-val" class="stat-value">0</div></div>
            <div class="stat-box"><div class="stat-label">🎯 1.000 KINGS</div><div id="perfect-val" class="stat-value">0</div></div>
        </div>
        <div class="timer-container">
            <div class="glass-board"><div id="timer">0.000</div><div id="feedback">PRESS START</div></div>
            <button id="action-btn" class="stop-btn">START</button>
        </div>
    </div>

    <div id="rank-view" class="view-panel">
        <div class="sub-tabs">
            <button id="sub-perfects" class="sub-btn active">🎯 1.000 Kings</button>
            <button id="sub-scores" class="sub-btn">💎 Total Scores</button>
        </div>
        <ul id="leaderboard" class="leaderboard-list"></ul>
        <div id="my-rank" class="my-absolute-rank">Your Rank: Loading...</div>
    </div>

    <div class="nav-tabs">
        <button id="tab-game" class="tab-btn active">🎮 GAME</button>
        <button id="tab-rank" class="tab-btn">🏆 RANKING</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let score = 0, perfects = 0, isRunning = false, startTime = 0, timerInterval = null;
        let user_id = tg.initDataUnsafe?.user?.id || 0;
        let user_name = tg.initDataUnsafe?.user?.first_name || "Player";
        let chat_id = tg.initDataUnsafe?.chat?.id || 0;

        // Auto-generated Worker URL from your Cloudflare project
        const BACKEND_URL = "https://workers.dev";

        const timerEl = document.getElementById('timer'), feedbackEl = document.getElementById('feedback');
        const actionBtn = document.getElementById('action-btn'), scoreVal = document.getElementById('score-val'), perfectVal = document.getElementById('perfect-val');

        function updateTimer() {
            let elapsed = (performance.now() - startTime) / 1000;
            if (elapsed >= 1.5) startTime = performance.now();
            timerEl.innerText = elapsed.toFixed(3);
        }

        actionBtn.addEventListener('click', () => {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            if (!isRunning) {
                isRunning = true; actionBtn.innerText = "STOP";
                actionBtn.style.background = "linear-gradient(90deg, #00f0ff, #0072ff)";
                feedbackEl.innerText = "FOCUS NOW..."; startTime = performance.now();
                timerInterval = setInterval(updateTimer, 1);
            } else {
                isRunning = false; clearInterval(timerInterval);
                actionBtn.innerText = "START";
                actionBtn.style.background = "linear-gradient(90deg, #ff007f, #7f00ff)";
                
                let finalTime = parseFloat(timerEl.innerText);
                let addedScore = 0, isPerfect = 0;

                if (finalTime === 1.000) {
                    perfects++; addedScore = 10; isPerfect = 1;
                    perfectVal.innerText = perfects;
                    feedbackEl.innerText = "🎯 PERFECT HIT! +10"; feedbackEl.style.color = "var(--neon-cyan)";
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                } else if (finalTime >= 0.990 && finalTime <= 1.010) {
                    addedScore = 1;
                    feedbackEl.innerText = "🔥 SO CLOSE! +1 SCORE"; feedbackEl.style.color = "#0072ff";
                } else {
                    feedbackEl.innerText = "❌ MISSED IT! TRY AGAIN"; feedbackEl.style.color = "var(--neon-pink)";
                }
                score += addedScore; scoreVal.innerText = score;

                if(user_id) {
                    fetch(`${BACKEND_URL}/save`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_id, user_name, chat_id, score: addedScore, perfect: isPerfect })
                    });
                }
            }
        });

        document.getElementById('tab-game').addEventListener('click', () => { toggleTab('game'); });
        document.getElementById('tab-rank').addEventListener('click', () => { toggleTab('rank'); loadLeaderboard('perfects'); });
